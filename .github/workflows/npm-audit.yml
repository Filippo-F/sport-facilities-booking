name: npm-audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # every Monday morning
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [server, client]   # the two package.json of the project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Runtime dependencies (any severity)
        run: npm audit --omit=dev --audit-level=low
        working-directory: ${{ matrix.package }}
      - name: All dependencies (high and critical)
        run: npm audit --audit-level=high
        working-directory: ${{ matrix.package }}
